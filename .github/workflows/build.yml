  name: CI - Test and Verify

  on:
    push:
      branches: [ "main" ]

  jobs:
    build:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v4

        - name: Set up Go
          uses: actions/setup-go@v5
          with:
            go-version: '1.25'

        - name: Run Tests
          env:
            GOARCH: amd64
            GOOS: linux
            CGO_ENABLED: 1
          run: go test -v ./...

        - name: Verify Build
          env:
            GOOS: linux
            GOARCH: arm64
            CGO_ENABLED: 0
          run: go build -o bootstrap ./cmd/photo-thumbnail