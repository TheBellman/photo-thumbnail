name: CI - Test and Verify

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Install HEIC dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libde265-dev

      - name: Run Tests
        env:
          GOARCH: amd64
          GOOS: linux
          CGO_ENABLED: 1
        run: go test -v ./...

      - name: Verify Build
        env:
          GOARCH: amd64
          GOOS: linux
          CGO_ENABLED: 1
        run:  go build -o bootstrap ./cmd/photo-thumbnail
